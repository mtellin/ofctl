name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, such as v0.1.0"
        required: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build and Publish Release
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build release binary
        run: swift build -c release --product ofctl

      - name: Package binary
        run: |
          mkdir -p dist
          cp .build/release/ofctl dist/ofctl
          tar -C dist -czf ofctl-macos-arm64.tar.gz ofctl
          shasum -a 256 ofctl-macos-arm64.tar.gz > ofctl-macos-arm64.tar.gz.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            ofctl-macos-arm64.tar.gz
            ofctl-macos-arm64.tar.gz.sha256
          generate_release_notes: true
